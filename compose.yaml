# Local synthetic demo only. Override credentials/origin for an external environment.
name: career-quest
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: career_quest
      POSTGRES_USER: career_quest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_quest_local_only}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_quest -d career_quest"]
      interval: 3s
      timeout: 3s
      retries: 20
  back:
    build: ./Back
    image: career-quest-back:local
    environment: &backend-environment
      DATABASE_URL: postgresql://career_quest:${POSTGRES_PASSWORD:-career_quest_local_only}@db:5432/career_quest
      API_PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      DEMO_MODE: ${DEMO_MODE:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATASET_PATH: ./data
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-}
      AI_MODEL_RECOMMEND: ${AI_MODEL_RECOMMEND:-}
      AI_INPUT_USD_PER_MILLION: ${AI_INPUT_USD_PER_MILLION:-0}
      AI_OUTPUT_USD_PER_MILLION: ${AI_OUTPUT_USD_PER_MILLION:-0}
      AI_PROJECT_BUDGET_USD: ${AI_PROJECT_BUDGET_USD:-40}
      AI_USER_DAILY_BUDGET_USD: ${AI_USER_DAILY_BUDGET_USD:-0.5}
      AI_USER_REQUESTS_PER_HOUR: ${AI_USER_REQUESTS_PER_HOUR:-20}
      AI_PROJECT_REQUESTS_PER_DAY: ${AI_PROJECT_REQUESTS_PER_DAY:-500}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-7000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-800}
      AI_MAX_INPUT_BYTES: ${AI_MAX_INPUT_BYTES:-24000}
      AI_RETENTION_DAYS: ${AI_RETENTION_DAYS:-30}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_USD_PER_MILLION: ${AI_EMBEDDING_USD_PER_MILLION:-0}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_TRUSTED_ORIGINS: ${OIDC_TRUSTED_ORIGINS:-}
      INTEGRATION_TARGETS_JSON: ${INTEGRATION_TARGETS_JSON:-}
      MESSENGER_TARGET_KEY: ${MESSENGER_TARGET_KEY:-}
      RECOMMENDATION_WEIGHTS: ${RECOMMENDATION_WEIGHTS:-}
      WORKER_DELIVERY_ENABLED: ${WORKER_DELIVERY_ENABLED:-false}
    command:
      - sh
      - -c
      - >-
        node dist/src/cli.js migrate &&
        if [ "$$DEMO_MODE" = true ]; then node dist/src/cli.js seed; fi &&
        exec node dist/src/index.js
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    build: ./Back
    image: career-quest-back:local
    environment: *backend-environment
    command: ["node", "dist/src/worker.js"]
    restart: unless-stopped
    depends_on:
      back: { condition: service_healthy }
  front:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      back: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
