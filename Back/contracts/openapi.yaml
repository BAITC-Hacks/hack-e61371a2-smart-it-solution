  "info": {
    "title": "Career Quest backend API",
    "version": "1.0.0",
    "description": "Implemented backend contract for Smart IT Solution. Prefix /api/v1; same-origin HttpOnly cookie sessions. All non-GET authenticated mutations require Origin=APP_ORIGIN and X-CSRF-Token. Idempotency-Key is required only where explicitly listed. Role checks use application roles, not employee profession. Current-profile reads include effective skills after assessment. Data dates follow dataset snapshot; audit, AI budgets and expiry use real server time. Some SQL row DTOs intentionally retain snake_case. See contracts/README.md and module contracts for workflow semantics. External systems and paid AI require explicit server configuration."
  },
